
name: CICD

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-slim
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Verify Code
        run: echo "Code cloned successfully"

  build:
    runs-on: ubuntu-slim
    needs: code
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Build using Docker
        run: echo "Building using Docker"

  test:
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Running test cases
        run: echo "Test cases running"

  deploy:
    runs-on: ubuntu-slim
    needs: test
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Deploying the code
        run: echo "Deployed successfully"
