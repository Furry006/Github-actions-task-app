#pipeline name 
name: CICD
# how it gets run or triggered
on:
  workflow_dispatch:
# what are jobs it should do in the pipeline
jobs:
# tasks of jobs like code build test deploy
  code:
  # it uses the unbuntu-slim for code 
    runs-on: ubuntu-slim
  # what are things it will do in the ubuntu-slim we can define multiple steps also
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Verify Code
        run: echo "Code cloned successfully"

  build:
    runs-on: ubuntu-slim
    needs: code
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Build using Docker
        run: echo "Building using Docker"

  test:
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Running test cases
        run: echo "Test cases running"

  deploy:
    runs-on: ubuntu-slim
    needs: test
    steps:
      - name: Clone the Code
        uses: actions/checkout@v4

      - name: Deploying the code
        run: echo "Deployed successfully"
